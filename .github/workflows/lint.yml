# Lint Workflow to check on every commit and pull requests
# to check if the code style guidelines are followed
name: lint, test and build

on:
  push:
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    name: Check for style guide compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies based on package-lock.json
        run: npm ci
        env:
          CI: true

      - name: Lint Code Base
        uses: github/super-linter@v4.8.0
        env:
          VALIDATE_ALL_CODEBASE: false
          LINTER_RULES_PATH: .github/linters
          FILTER_REGEX_EXCLUDE: .*(package-lock\.json|yarn\.lock).*
          JAVASCRIPT_ES_CONFIG_FILE: .eslintrc.json
          TYPESCRIPT_ES_CONFIG_FILE: .eslintrc.json
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_MARKDOWN: false
          # scss 스타일은 로컬 npm run stylelint(.stylelintrc)가 담당 — CI standard 규칙과 관례 불일치
          VALIDATE_CSS: false
          DEFAULT_BRANCH: develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run tests and build the app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies based on package-lock.json
        run: npm ci
        env:
          CI: true

      - name: Run Tests
        # 테스트 파일이 아직 없으므로 없을 때는 통과시킨다 (생기면 자동 실행)
        run: npm test -- --passWithNoTests
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
